<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="player">

        <img
        id="cover"
        class="cover"
        src="images/cover1.jpg"
        alt="Album Cover">

        <h2 id="title">

            Despacito

        </h2>

        <h4 id="artist">

            Luis Fonsi

        </h4>

        <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100">

        <div class="time">

            <span id="current">

                0:00

            </span>

            <span id="duration">

                0:00

            </span>

        </div>

        <div class="controls">

            <button id="prev">

                <i class="fas fa-backward"></i>

            </button>

            <button id="play">

                <i class="fas fa-play"></i>

            </button>

            <button id="next">

                <i class="fas fa-forward"></i>

            </button>

        </div>

        <div class="volume">

            <i class="fas fa-volume-high"></i>

            <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1">

        </div>

        <div class="playlist">

            <h3>

                Playlist

            </h3>

            <ul id="playlist">

            </ul>

        </div>

    </div>

</div>

<audio id="audio"></audio>

<script src="script.js"></script>

</body>

</html>
